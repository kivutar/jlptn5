<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.52" stop-color="#eef9f1"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183f2a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1024" height="500" rx="0" fill="url(#background)"/>
  <circle cx="77" cy="72" r="116" fill="#f6c94c" opacity="0.12"/>
  <circle cx="840" cy="420" r="190" fill="#64ad79" opacity="0.12"/>
  <circle cx="970" cy="54" r="86" fill="#a98bdf" opacity="0.10"/>

  <g transform="translate(76 146)">
    <text x="0" y="0" fill="#143e28" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="60" font-weight="800">ChakuChaku</text>
    <text x="2" y="52" fill="#316744" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="27" font-weight="650">JLPT N5 · Japanese, step by step</text>
    <rect x="2" y="91" width="92" height="7" rx="3.5" fill="#ecb930"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="792" cy="250" r="178" fill="#ffffff" opacity="0.84"/>
    <image x="604" y="62" width="376" height="376" xlink:href="logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
