<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JLPT N5</title>
    <link rel="stylesheet" href="styles.css">
    <script src="learning-stats.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="profile-menu-container">
      <button
        id="profile-menu-button"
        class="profile-menu-button"
        type="button"
        aria-label="Open user menu"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="profile-menu"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="5"></circle>
          <path d="M20 21a8 8 0 0 0-16 0"></path>
        </svg>
      </button>
      <div id="profile-menu" class="profile-menu" role="menu" hidden>
        <button type="button" role="menuitem" tabindex="-1">Settings</button>
        <button type="button" role="menuitem" tabindex="-1">Statistics</button>
        <button type="button" role="menuitem" tabindex="-1">About</button>
      </div>
    </div>
    <main>
      <div class="lesson">
        <button
          id="speak-button"
          class="speak-button lesson-control"
          type="button"
          aria-label="音声を再生"
          title="音声を再生"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div id="lesson-stage" class="lesson-stage">
          <p
            id="lesson-sentence"
            class="lesson-sentence"
            aria-label="日本語能力試験N5のレッスンへようこそ。さあ、始めましょう。"
          ></p>
          <input
            id="translation-input"
            class="translation-input"
            type="text"
            lang="en"
            aria-label="英語の翻訳"
            placeholder="英語に訳してください"
            autocomplete="off"
            hidden
          >
        </div>
        <div
          id="solution"
          class="solution"
          lang="en"
          role="status"
          aria-live="polite"
        ></div>
        <button
          id="action-button"
          class="action-button lesson-control"
          type="button"
        >次へ</button>
      </div>
    </main>
  </body>
</html>
